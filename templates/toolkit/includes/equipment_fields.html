<p><label>Nom<input name="name" required maxlength="120" value="{{ item.name|default:'' }}"></label></p>
{% if kind == "weapon" %}
<p><label>Mains<select name="hands"><option value="1" {% if item.hands == 1 %}selected{% endif %}>1 main</option><option value="2" {% if item.hands == 2 %}selected{% endif %}>2 mains</option></select></label></p>
<p><label>Portée<select name="optimal_range">
<option value="CONTACT" {% if item.optimal_range == "CONTACT" %}selected{% endif %}>Contact</option>
<option value="SHORT" {% if item.optimal_range == "SHORT" %}selected{% endif %}>Courte</option>
<option value="MEDIUM" {% if item.optimal_range == "MEDIUM" %}selected{% endif %}>Moyenne</option>
<option value="LONG" {% if item.optimal_range == "LONG" %}selected{% endif %}>Longue</option>
</select></label></p>
<p><label>Puissance<input type="number" name="power" required value="{{ item.power|default:0 }}"></label></p>
<p><label>Visée<input type="number" name="aim" required value="{{ item.aim|default:0 }}"></label></p>
<p><label>Propriété<input name="property_name" maxlength="120" value="{{ item.property_name|default:'' }}"></label></p>
<p><label>Description de propriété<textarea name="property_text">{{ item.property_text|default:'' }}</textarea></label></p>
{% elif kind == "implant" %}
<p><label>Propriété<input name="property_name" maxlength="120" value="{{ item.property_name|default:'' }}"></label></p>
<p><label>Description de propriété<textarea name="property_text">{{ item.property_text|default:'' }}</textarea></label></p>
{% elif kind == "ability" %}
<p><label>Description<textarea name="description">{{ item.description|default:'' }}</textarea></label></p>
<p><label>Effet<select name="effect_type">
<option value="">Aucun effet mécanique</option>
<option value="damage_contact" {% if item.effect_type == "damage_contact" %}selected{% endif %}>Dégâts Contact</option>
<option value="damage_distance" {% if item.effect_type == "damage_distance" %}selected{% endif %}>Dégâts Distance</option>
<option value="aim" {% if item.effect_type == "aim" %}selected{% endif %}>Visée</option>
<option value="armor" {% if item.effect_type == "armor" %}selected{% endif %}>Armure</option>
<option value="shield" {% if item.effect_type == "shield" %}selected{% endif %}>PB</option>
<option value="healing" {% if item.effect_type == "healing" %}selected{% endif %}>Soin</option>
<option value="max_hp" {% if item.effect_type == "max_hp" %}selected{% endif %}>PV</option>
<option value="reactions" {% if item.effect_type == "reactions" %}selected{% endif %}>Réactions</option>
<option value="vigilance" {% if item.effect_type == "vigilance" %}selected{% endif %}>Vigilance</option>
</select></label></p>
<p><label>Calcul<select name="scaling"><option value="fixed" {% if item.scaling != "level" %}selected{% endif %}>Fixe</option><option value="level" {% if item.scaling == "level" %}selected{% endif %}>Par niveau</option></select></label></p>
<p><label>Valeur<input type="number" name="value" required value="{{ item.value|default:0 }}"></label></p>
{% endif %}
