{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TMP-GMTK{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tmp-theme.css' %}">
</head>
<body>
<header class="site-header">
    <a class="site-brand" href="{% url 'table' %}" aria-label="The Moira Protocol — Game Master Toolkit">
        <img class="brand-mark" src="{% static 'img/tmp-mark.png' %}" alt="Logo TMP" onerror="this.style.display='none'">
        <img class="brand-wordmark" src="{% static 'img/tmp-gmtk-wordmark.png' %}" alt="The Moira Protocol — Game Master Toolkit" onerror="this.style.display='none';this.nextElementSibling.hidden=false">
        <strong hidden>THE MOIRA PROTOCOL — GAME MASTER TOOLKIT</strong>
    </a>
    {% if user.is_authenticated %}
    <nav class="site-nav" aria-label="Navigation principale">
        <a href="{% url 'table' %}" {% if request.resolver_match.url_name == 'table' %}aria-current="page"{% endif %}>Table</a>
        <a href="{% url 'monster_builder' %}" {% if request.resolver_match.url_name == 'monster_builder' %}aria-current="page"{% endif %}>Monster Builder</a>
        <a href="{% url 'bestiary' %}" {% if request.resolver_match.url_name == 'bestiary' %}aria-current="page"{% endif %}>Bestiaire</a>
        <a href="{% url 'encounters' %}" {% if request.resolver_match.url_name == 'encounters' %}aria-current="page"{% endif %}>Rencontres</a>
    </nav>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Déconnexion</button>
    </form>
    {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
